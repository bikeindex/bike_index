production:
  rails:
    configuration:
      ruby_version: "4.0.6"
      node_version: "24.15.0"
  # usr1 is a Puma phased restart: workers recycle under a master that never dies, so
  # nginx's socket never disappears. Env var changes still need a hard restart.
  procfile_metadata:
    web:
      restart_signal: usr1
