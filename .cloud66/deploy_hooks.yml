production:
  # Install postgres (to enable db:structure:load) and ripgrep. libheif from its PPA: noble's
  # 1.17.6 rejects some iPhone HEICs' depth maps (fixed in 1.18), and its HEVC decoder is a plugin
  first_thing:
    - command: sudo add-apt-repository -y ppa:strukturag/libheif && sudo apt-get -y install postgresql-client-common ripgrep libvips libheif1 libheif-plugin-libde265
      target: rails
      sudo: true
      apply_during: build_only

  after_symlink:
    # Make skylight pid & daemon files writable
    - command: touch /tmp/skylight.pid && sudo chown nginx:app_writers /tmp/skylight* && chmod -R 775 /tmp/skylight*
      target: rails
      run_on: all_servers
      sudo: true
    # Make the uploads cache folder writable. Not -R: Sidekiq deletes cached files mid-walk
    - command: sudo chown nginx:app_writers $RAILS_STACK_PATH/tmp/cache && chmod 775 $RAILS_STACK_PATH/tmp/cache
      target: rails
      run_on: all_servers
      sudo: true

  after_rails:
    # Make papertrail connected
    - source: /.cloud66/log_files.yml
      destination: /etc/log_files.yml
      sudo: true
      target: rails
      apply_during: build_only

  last_thing:
    # Trigger honeybadger deploy hook
    - command: cd $RAILS_STACK_PATH && bundle exec rake trigger_honeybadger_deploy
      target: rails
      execute: true
      run_on: single_server
