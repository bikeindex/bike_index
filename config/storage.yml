test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>
  public: true

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>
  public: true

# Only for the specs that upload for real (image_jobs/process_public_image_job_spec); the rest of the
# suite stays on :test. Its own bucket so CI churn doesn't land where review apps serve from.
cloudflare_test:
  service: S3
  endpoint: <%= ENV["R2_TEST_ENDPOINT"] %>
  access_key_id: <%= ENV["R2_TEST_ACCESS_KEY"] %>
  secret_access_key: <%= ENV["R2_TEST_ACCESS_KEY_SECRET"] %>
  bucket: bikeindex-test
  region: auto
  public: true

cloudflare_dev:
  service: S3
  endpoint: <%= ENV["R2_DEV_ENDPOINT"] %>
  access_key_id: <%= ENV["R2_DEV_ACCESS_KEY"] %>
  secret_access_key: <%= ENV["R2_DEV_ACCESS_KEY_SECRET"] %>
  bucket: bikeindex-dev
  region: auto
  public: true
  http_open_timeout: 5
  http_read_timeout: 10
  retry_limit: 1
  # When upgrading S3, this will need to be uncommented
  # request_checksum_calculation: "when_required"
  # response_checksum_validation: "when_required"

cloudflare_production:
  service: S3
  endpoint: <%= ENV["R2_ENDPOINT"] %>
  access_key_id: <%= ENV["R2_ACCESS_KEY"] %>
  secret_access_key: <%= ENV["R2_ACCESS_KEY_SECRET"] %>
  bucket: bikeindex
  region: auto
  public: true
  # The SDK defaults to a 60s read and 3 retries, so a hung R2 outlasts rack-timeout's 30s.
  # Worst case here is 2 reads = 20s
  http_open_timeout: 5
  http_read_timeout: 10
  retry_limit: 1
  # When upgrading S3, this will need to be uncommented
  # request_checksum_calculation: "when_required"
  # response_checksum_validation: "when_required"
