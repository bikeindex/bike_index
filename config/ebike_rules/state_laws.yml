NY:
  reviewed: 2026-Q3
  summary: New York allows Class 1 and 2 statewide. Class 3 is limited to cities of one million or more (New York City), with a 25 mph cap.
  classes: [1, 2, 3]
  watt_cap: 750
  speed: {1: 20, 2: 20, 3: 25}
  age_min: {1: 16, 2: 16, 3: 16}
  helmet_all: [3]
  helmet_minor: [1, 2]
  paths_restricted: [3]
  text:
    classes: Class 1 and 2 statewide; Class 3 only in New York City
    speed: 20 mph for Class 1–2, 25 mph for Class 3
    throttle: Allowed on Class 2.
    age: 16 or older for all classes.
    helmet: Required for Class 3 riders, and for riders 16–17 on any class.
    paths: Roads and bike lanes. Local governments set path and greenway rules.
    label: Class label required.
  cite:
    classes: {code: N.Y. VTL § 102-C, title: Bicycle with electric assist, url: "https://www.nysenate.gov/legislation/laws/VAT/102-C"}
    power: {code: N.Y. VTL § 102-C, title: Motor under 750 watts, url: "https://www.nysenate.gov/legislation/laws/VAT/102-C"}
