  classes: [1, 2, 3]
  watt_cap: 750
  speed: {1: 20, 2: 20, 3: 28}
  age_min: {3: 15}
  helmet_all: []
  helmet_minor: [3]
  paths_restricted: [3]
  text:
    classes: Class 1, 2 and 3
    speed: 20 mph for Class 1–2, 28 mph for Class 3
    throttle: Allowed on Class 2.
    age: 15 or older for Class 3. No minimum for Class 1–2.
    helmet: Required for riders under 18 on Class 3 only.
    paths: "Class 1–2: anywhere bicycles can ride. Class 3: roads and bike lanes; local paths may restrict."
    label: Class label required on new e-bikes.
