    throttle: {code: N.Y. VTL § 102-C, title: Throttle by class, url: "https://www.nysenate.gov/legislation/laws/VAT/102-C"}
    age: {code: N.Y. VTL § 1242, title: Operator age, url: "https://www.nysenate.gov/legislation/laws/VAT/1242"}
    helmet: {code: N.Y. VTL § 1242, title: Helmet requirements, url: "https://www.nysenate.gov/legislation/laws/VAT/1242"}
    paths: {code: N.Y. VTL § 1242, title: Where to ride, url: "https://www.nysenate.gov/legislation/laws/VAT/1242"}
    label: {code: N.Y. VTL § 102-C, title: Labeling, url: "https://www.nysenate.gov/legislation/laws/VAT/102-C"}
