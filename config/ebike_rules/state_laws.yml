# E-bike rules by state, keyed by abbreviation, for /ebike-rules. Every entry is a placeholder from
# the design handoff: each summary, statute number and URL needs legal review before launch.
#
# classes: the e-bike classes the state recognizes
# watt_cap: the motor power cap, in watts
# speed: each class's top assisted speed, in mph
# age_min: each class's minimum rider age, where it has one
# helmet_all / helmet_minor: the classes whose every rider, or only riders under 18, need a helmet
# paths_restricted: the classes kept off bike paths and trails
# text: each rule in plain language
# cite: each rule's statute
CA:
  reviewed: 2026-Q3
  summary: California recognizes all three e-bike classes. Class 3 riders must be 16 or older and wear a helmet, and Class 3 bikes are kept off most paths.
  classes: [1, 2, 3]
  watt_cap: 750
  speed: {1: 20, 2: 20, 3: 28}
  age_min: {3: 16}
  helmet_all: [3]
  helmet_minor: [1, 2]
  paths_restricted: [3]
  text:
    classes: Class 1, 2 and 3
    speed: 20 mph for Class 1–2, 28 mph for Class 3
    throttle: Allowed on Class 2. Class 1 and 3 are pedal-assist only.
    age: 16 or older for Class 3. No minimum for Class 1–2.
    helmet: Required for all Class 3 riders, and for anyone under 18.
    paths: "Class 1–2: bike paths, lanes and roads unless locally banned. Class 3: roads and bike lanes only, unless local rules allow paths."
    label: A manufacturer label showing class, top speed and motor wattage is required.
  cite:
    classes: {code: Cal. Veh. Code § 312.5, title: E-bike definition and classes, url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=VEH&sectionNum=312.5"}
    power: {code: Cal. Veh. Code § 312.5, title: Motor under 750 watts, url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=VEH&sectionNum=312.5"}
    speed: {code: Cal. Veh. Code § 312.5, title: Assisted speed by class, url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=VEH&sectionNum=312.5"}
    throttle: {code: Cal. Veh. Code § 312.5, title: Throttle by class, url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=VEH&sectionNum=312.5"}
    age: {code: Cal. Veh. Code § 21213, title: Class 3 operation, url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=VEH&sectionNum=21213"}
    helmet: {code: Cal. Veh. Code § 21213, title: Class 3 helmet; § 21212 under 18, url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=VEH&sectionNum=21213"}
    paths: {code: Cal. Veh. Code § 21207.5, title: Paths and trails, url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=VEH&sectionNum=21207.5"}
    label: {code: Cal. Veh. Code § 24016, title: Classification label, url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=VEH&sectionNum=24016"}
CO:
  reviewed: 2026-Q2
  summary: Colorado recognizes all three classes. Class 3 riders must be 16 or older; riders under 18 on Class 3 need a helmet.
  classes: [1, 2, 3]
  watt_cap: 750
  speed: {1: 20, 2: 20, 3: 28}
  age_min: {3: 16}
  helmet_all: []
  helmet_minor: [3]
  paths_restricted: [3]
  text:
    classes: Class 1, 2 and 3
    speed: 20 mph for Class 1–2, 28 mph for Class 3
    throttle: Allowed on Class 2.
    age: 16 or older for Class 3. Younger riders may ride as passengers.
    helmet: Required for riders under 18 on Class 3.
    paths: "Class 1–2: bike paths unless locally banned. Class 3: not on bike or pedestrian paths unless local rules allow."
    label: Class label required on new e-bikes.
  cite:
    classes: {code: C.R.S. § 42-1-102(28.5), title: E-bike definition, url: "https://leg.colorado.gov/colorado-revised-statutes"}
    power: {code: C.R.S. § 42-1-102(28.5), title: Motor of 750 watts or less, url: "https://leg.colorado.gov/colorado-revised-statutes"}
    speed: {code: C.R.S. § 42-1-102(28.5), title: Assisted speed by class, url: "https://leg.colorado.gov/colorado-revised-statutes"}
    throttle: {code: C.R.S. § 42-1-102(28.5), title: Throttle by class, url: "https://leg.colorado.gov/colorado-revised-statutes"}
    age: {code: C.R.S. § 42-4-1412(14), title: Class 3 age, url: "https://leg.colorado.gov/colorado-revised-statutes"}
    helmet: {code: C.R.S. § 42-4-1412(14), title: Class 3 helmet, url: "https://leg.colorado.gov/colorado-revised-statutes"}
    paths: {code: C.R.S. § 42-4-1412(14), title: Path access, url: "https://leg.colorado.gov/colorado-revised-statutes"}
    label: {code: C.R.S. § 42-4-1412(14), title: Labeling, url: "https://leg.colorado.gov/colorado-revised-statutes"}
IN:
