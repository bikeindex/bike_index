          faq_confront_answer: >-
            No. Call the police, give them your case number and a link to your Bike
            Index listing, and let them make contact. People have been hurt trying
            to take a bike back themselves.
          faq_confront_question: Should I confront the person who has my bike?
          faq_cost_answer: >-
            Registering a bike, marking it stolen, and using the recovery tools are
            free. Bike Index is a nonprofit funded by donations, partner organizations,
            and optional promoted alerts.
          faq_cost_question: Does any of this cost money?
          faq_other_city_answer: >-
            The registry is international, and recoveries happen hundreds of miles
            from the theft. Your listing stays live and searchable until you mark
            the bike recovered.
          faq_other_city_question: What if it turns up in another city?
          faq_serial_answer: >-
            Register anyway. Photos, a purchase receipt, shop service records, insurance
            paperwork, or a Strava photo can all identify a bike. Add whatever you
            have, and check with the shop that sold it — they often have the serial
            on file.
          faq_serial_question: I don't have my serial number.
          faq_unregistered_answer: >-
            That is the common case. You can register it as stolen right now; there
            is no requirement that it was registered beforehand.
          faq_unregistered_question: My bike was never registered before it was stolen.
