          how_alerts_work: How alerts work
          lede: >-
            Six steps, in order. The first two matter most: file a police report to
            get a case number, then register the bike as stolen on Bike Index so every
            shop, officer, and buyer who checks a serial finds yours.
          lede_short: >-
            Police report first, for the case number. Bike Index second, so the serial
            is public.
