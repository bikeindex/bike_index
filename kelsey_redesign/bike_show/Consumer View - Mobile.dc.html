<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</helmet>
<div style="min-height:100vh; background:#ecedf0; padding:34px 20px; display:flex; justify-content:center; align-items:flex-start; font-family:'Hanken Grotesk',sans-serif;">
  <div style="width:410px; flex:none; border-radius:46px; padding:10px; background:#1a1a1f; box-shadow:0 24px 60px rgba(0,0,0,.28);">
    <div style="position:relative; border-radius:38px; overflow:hidden; background:#fafafa;">
      <div style="position:absolute; top:8px; left:50%; transform:translateX(-50%); width:128px; height:26px; background:#1a1a1f; border-radius:16px; z-index:20;"></div>
      <dc-import name="BikeConsumerMobile" viewer="{{ viewer }}" stolen="{{ stolen }}" hint-size="100%,1700px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:490,&quot;height&quot;:1780},&quot;viewer&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;owner&quot;,&quot;authorized&quot;,&quot;public&quot;],&quot;default&quot;:&quot;owner&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stolen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}"></script>
</body>
</html>
