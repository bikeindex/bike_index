  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tolen in Salt Lake City on Jun 24, 2026 · If you’ve seen it, report a sighting.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- badges -->\n      <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;\">\n        <span style=\"display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:#016ec2; background:#e7f3fb; padding:6px 11px; border-radius:999px;\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#016ec2\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><\u002Fsvg>Registered &amp; protected<\u002Fspan>\n        <span style=\"display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:{{ stolenTagColor }}; background:{{ stolenTagBg }}; padding:6px 11px; border-radius:999px;\"><span style=\"width:7px; height:7px; border-radius:50%; background:{{ stolenTagColor }};\"><\u002Fspan>{{ stolenTag }}<\u002Fspan>\n        <span style=\"display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:#6b6b73; background:#f0f0f2; padding:6px 11px; border-radius:999px;\">Registered since May 2026<\u002Fspan>\n      <\u002Fdiv>\n\n      <!-- trust widget (congruent with admin widgets; fills negative space) -->\n      <div style=\"background:#fff; border:1px solid #ece9f5; border-radius:12px; padding:15px 16px; box-shadow:0 1px 2px rgba(17,17,26,.04);\">\n        <div style=\"font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#9a9aa2; margin-bottom:12px;\">This bike on Bike Index<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"display:flex; justify-content:space-between; gap:12px;\"><span style=\"font-size:13px; color:#9a9aa2;\">Registered since<\u002Fspan><span style=\"font-size:13.5px; color:#333; font-weight:600;\">May 2026<\u002Fspan>< div style=\"display:flex; gap:9px;\">\n          <button onclick=\"{{ onContact }}\" style=\"flex:1; padding:13px; border:none; border-radius:11px; background:#715eb2; color:#fff; font-weight:800; font-size:13.5px; cursor:pointer; font-family:inherit;\">Contact owner via Bike Index<\u002Fbutton>\n          <button onclick=\"{{ onShare }}\" style=\"flex:1; padding:13px; border:1px solid #e5e5e5; border-radius:11px; background:#fff; color:#333; font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit;\">Share<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isPublic }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; gap:9px;\">\n          <button onclick=\"{{ onReportStolen }}\" style=\"flex:1; padding:13px; border:none; border-radius:11px; background:#c0392b; color:#fff; font-weight:800; font-size:13.5px; cursor:pointer; font-family:inherit;\">Report stolen via Bike Index<\u002Fbutton>\n          <button onclick=\"{{ onShare }}\" style=\"flex:1; padding:13px; border:1px solid #e5e5e5; border-radius:11px; background:#fff; color:#333; font-weight:700; font-size:13.5px; cursor:pointer; font-family:inherit;\">Share<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- lower bands -->\n  <div style=\"padding:22px 26px; display:flex; flex-direction:column; gap:18px;\">\n\n    <!-- bike details (congruent with admin; all info except BI reg # + credibility) -->\n    <div style=\"background:#fff; border:1px solid #eee; border-radius:14px; padding:20px 22px; box-shadow:0 1px 2px rgba(17,17,26,.04);\">\n      <div style=\"font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#9a9aa2; margin-bottom:16px;\">Bike details<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:18px 20px;\">\n        <div><div style=\"font-size:11.5px; color:#9a9aa2; margin-bottom:3px;\">Serial<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:500; color:#333;\">WTU218JV6136R<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:11.5px; color:#9a9aa2; margin-bottom:3px;\">Sticker #<\u002Fdiv><div style=\"font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:500; color:#333;\">A 471 829<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:11.5px; color:#9a9aa2; margin-bottom:3px;\">Manufacturer<\u002Fdiv><div style=\"font-size:14.5px; color:#333;\">Trek<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:11.5px; color:#9a9aa2; margin-bottom:3px;\">Model<\u002Fdiv><div style=\"font-size:14.5px; color:#333;\">X-Caliber<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:11.5px; color:#9a9aa2; margin-bottom:3px;\">Year<\u002Fdiv><div style=\"font-size:14.5px; color:#333;\">2022<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:11.5px; color:#9a9aa2; margin-bottom:3px;\">Activity<\u002Fdiv><div style=\"font-size:14.5px; color:#333;\">Mountain<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:11.5px; color:#9a9aa2; margin-bottom:3px;\">Primary colors<\u002Fdiv><div style=\"font-size:14.5px; color:#333; display:flex; align-items:center; gap:7px;\"><span style=\"width:12px; height:12px; border-radius:3px; background:#e23b3b;\"><\u002Fspan>Red<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:11.5px; color:#9a9aa2; margin-bottom:3px;\">Frame material<\u002Fdiv><div style=\"font-size:14.5px; color:#333;\">Aluminum<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-size:11.5px; color:#9a9aa2; margin-bottom:3px;\">Frame size<\u002Fdiv><div style=\"font-size:14.5px; color:#333;\">S<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- about / story -->\n    <div style=\"background:#fff; border:1px solid #eee; border-radius:14px; padding:20px 22px; box-shadow:0 1px 2px rgba(17,17,26,.04);\">\n      <div style=\"font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#9a9aa2; margin-bottom:10px;\">About this bike<\u002Fdiv>\n      <p style=\"margin:0; font-size:14px; line-height:1.55; color:#5b5b63; text-wrap:pretty;\">My everyday trail companion — built up for fast singletrack and the occasional bikepacking weekend. Registered on Bike Index so it’s protected, recognizable, and ready to show off.<\u002Fp>\n      <div style=\"display:flex; align-items:center; gap:8px; margin-top:14px; font-size:12.5px; color:#9a9aa2;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9a9aa2\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 6v6l4 2\"><\u002Fpath><\u002Fsvg>Registered May 7, 2026<\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- full spec sheet (expandable, below the fold) -->\n    <div>\n      <button onclick=\"{{ onToggleSpecs }}\" style=\"display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; padding:15px 22px; border:1px solid #eee; border-radius:14px; background:#fff; cursor:pointer; font-family:inherit; box-shadow:0 1px 2px rgba(17,17,26,.04);\" style-hover=\"border-color:#d6d4e0;\">\n        <span style=\"display:flex; flex-direction:column; align-items:flex-start; gap:2px;\"><span style=\"font-size:14.5px; font-weight:700; color:#333;\">Full spec sheet<\u002Fspan><span style=\"font-size:12.5px; color:#9a9aa2;\">{{ specHint }}<\u002Fspan><\u002Fspan>\n        <span style=\"display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:#715eb2;\">{{ specToggleLabel }}<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#715eb2\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <\u002Fbutton>\n      <sc-if value=\"{{ expanded }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex; flex-direction:column; gap:14px; margin-top:14px;\">\n        <sc-for list=\"{{ specGroups }}\" as=\"group\" hint-placeholder-count=\"3\">\n        <div style=\"background:#fff; border:1px solid #eee; border-radius:14px; padding:18px 22px; box-shadow:0 1px 2px rgba(17,17,26,.04);\">\n          <div style=\"font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#715eb2; margin-bottom:14px;\">{{ group.title }}<\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(2,1fr); gap:13px 22px;\">\n            <sc-for list=\"{{ group.rows }}\" as=\"row\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex; gap:12px;\"><span style=\"flex:none; width:92px; font-size:12px; color:#9a9aa2; text-align:right;\">{{ row.label }}<\u002Fspan><span style=\"flex:1; font-size:13.5px; color:#333; line-height:1.4;\">{{ row.value }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- think this bike is stolen? (universal) -->\n  <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 30px; background:#fff; border-top:1px solid #eee;\">\n    <div style=\"display:flex; align-items:center; gap:12px;\">\n      <span style=\"width:34px; height:34px; flex:none; border-radius:9px; background:#fdecea; display:flex; align-items:center; justify-content:center;\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#c0392b\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10.3 3.8 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0z\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <div><div style=\"font-size:14px; font-weight:700; color:#333;\">Think this bike is stolen?<\u002Fdiv><div style=\"font-size:12.5px; color:#9a9aa2;\">{{ stolenHelpSub }}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <button onclick=\"{{ onStolenHelp }}\" style=\"flex:none; padding:9px 16px; border:1px solid #e5e5e5; border-radius:9px; background:#fff; color:#333; font-weight:700; font-size:13px; cursor:pointer; font-family:inherit;\" style-hover=\"background:#f7f5fc; border-color:#715eb2;\">{{ stolenHelpCta }}<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- toast -->\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:absolute; bottom:18px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 20px; border-radius:11px; font-size:13.5px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.25); z-index:5;\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;viewer&quot;:{&quot;default&quot;:&quot;owner&quot;},&quot;stolen&quot;:{&quot;default&quot;:false}}\">\nclass Component extends DCLogic {\n  state = { toast: '', expanded: false };\n  fire(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: '' }), 2200);\n  }\n  toggleSpecs() { this.setState(s => ({ expanded: !s.expanded })); }\n  renderVals() {\n    const viewer = this.props.viewer || 'owner';   // 'owner' | 'authorized' | 'public'\n    const isOwner = viewer === 'owner';\n    const isAuthorized = viewer === 'authorized';\n    const isPublic = viewer === 'public';\n    const isViewer = !isOwner;\n    const canContact = isAuthorized;                // contact owner: authorized roles only\n    const stolen = !!this.props.stolen;\n\n    let audiencePill, pillColor;\n    if (isOwner) { audiencePill = 'Your bike'; pillColor = '#1f8a5b'; }\n    else if (isAuthorized) { audiencePill = 'Authorized view'; pillColor = '#715eb2'; }\n    else { audiencePill = 'Public view'; pillColor = '#3397dc'; }\n\n    const expanded = !!this.state.expanded;\n    const specGroups = [\n      { title: 'Frame & fork', rows: [\n        { label: 'Front fork', value: 'RockShox Judy SL, 100mm travel, Boost110' },\n        { label: 'Rear susp.', value: 'None — hardtail' },\n        { label: 'Headset', value: 'Semi-integrated, sealed cartridge' },\n      ]},\n      { title: 'Wheels & tires', rows: [\n        { label: 'Wheel size', value: '29 in' },\n        { label: 'Tire width', value: '2.20 in' },\n        { label: 'Front wheel', value: 'Bontrager Connection, Tubeless Ready' },\n        { label: 'Rear wheel', value: 'Bontrager Connection, Tubeless Ready' },\n        { label: 'Front tire', value: 'Bontrager XR2 Team Issue, 29×2.20\"' },\n        { label: 'Rear tire', value: 'Bontrager XR2 Team Issue, 29×2.20\"' },\n      ]},\n      { title: 'Drivetrain', rows: [\n        { label: 'Speeds', value: '1 × 12' },\n        { label: 'Chain', value: 'Shimano Deore M6100' },\n        { label: 'Crankset', value: 'Shimano, 32T' },\n        { label: 'Bottom br.', value: '73mm BSA threaded' },\n        { label: 'Rear der.', value: 'Shimano Deore M6100, 12-speed' },\n        { label: 'Pedals', value: 'Not included' },\n      ]},\n      { title: 'Brakes', rows: [\n        { label: 'Front/rear', value: 'Shimano MT200 hydraulic disc' },\n      ]},\n      { title: 'Cockpit & finishing', rows: [\n        { label: 'Handlebar', value: 'Flat alloy, 720mm' },\n        { label: 'Saddle', value: 'Bontrager Arvada' },\n        { label: 'Seatpost', value: 'Bontrager alloy, 31.6mm' },\n      ]},\n      { title: 'Distinguishing features', rows: [\n        { label: 'Notes', value: 'Custom blue cable housing; small scratch on the top tube near the head badge.' },\n      ]},\n    ];\n\n    return {\n      isOwner, isViewer, isAuthorized, isPublic, canContact, audiencePill, pillColor,\n      stolen,\n      stolenTag: stolen ? 'Reported stolen' : 'Not stolen',\n      stolenTagColor: stolen ? '#c0392b' : '#1f8a5b',\n      stolenTagBg: stolen ? '#fdecea' : '#e8f5ee',\n      stolenStatusValue: stolen ? 'Reported stolen' : 'Not reported',\n      ownerStolenLabel: stolen ? 'Update stolen report' : 'Mark stolen',\n      onReportStolen: () => this.fire('Report this bike as stolen via Bike Index'),\n      expanded,\n      specGroups,\n      specToggleLabel: expanded ? 'Hide' : 'Show all',\n      specHint: 'Frame, drivetrain, wheels, brakes & more',\n      onToggleSpecs: () => this.setState(s => ({ expanded: !s.expanded })),\n      stolenHelpSub: isAuthorized\n        ? 'Your role can access owner contact.'\n        : 'See the Bike Index guide for reporting a stolen bike.',\n      stolenHelpCta: isAuthorized ? 'Get owner contact' : 'What to do',\n      hasToast: !!this.state.toast,\n      toast: this.state.toast,\n      onMarketplace: () => this.fire('Listing on Marketplace'),\n      onShare: () => this.fire('Share link copied'),\n      onStolen: () => this.fire('Report bike as stolen'),\n      onContact: () => this.fire('Contact form opened (owner stays private)'),\n      onSeen: () => this.fire('Sighting reported'),\n      onEditPhotos: () => this.fire('Edit gallery photos'),\n      onEditBike: () => this.fire('Opening the edit-bike page'),\n      onStolenHelp: () => this.fire(isAuthorized\n        ? 'Owner contact — craig@bikeindex.org · 415-602-6066'\n        : 'Opening the Bike Index stolen-bike guide'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
