# Comment this whole workflow out (or disable it in the Actions tab) after the
# first successful run. It uploads the static basemap assets - the style, glyphs
# and sprites the tiles need to render - which almost never change, unlike the
# quarterly tiles refresh in upload-basemap.yml. Re-enable only to change theme
# or bump the Protomaps basemap version.
#
# One-time: generates the light-theme style.json (pointing glyphs, sprites and the
# tiles source at maps.bikeindex.org) and syncs the Protomaps glyphs + sprites into
# the maps R2 bucket under basemap/. Same maps-upload environment + R2_MAPS_* secrets
# as upload-basemap.yml.
name: Upload basemap assets

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: maps-upload
    env:
      HOST: https://maps.bikeindex.org/basemap
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_MAPS_ENDPOINT }}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_MAPS_ACCESS_KEY }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_MAPS_ACCESS_KEY_SECRET }}
    steps:
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Generate light-theme style.json
        run: |
          npm install protomaps-themes-base >/dev/null 2>&1
          cat > gen-style.mjs <<'JS'
          import layers from "protomaps-themes-base"
          import { writeFileSync } from "node:fs"
          const HOST = process.env.HOST
          const style = {
            version: 8,
            glyphs: `${HOST}/fonts/{fontstack}/{range}.pbf`,
            sprite: `${HOST}/sprites/v4/light`,
            sources: {
              protomaps: {
                type: "vector",
                url: `pmtiles://${HOST}/tiles.pmtiles`,
                attribution: "© OpenStreetMap contributors"
              }
            },
            layers: layers("protomaps", "light")
          }
          writeFileSync("style.json", JSON.stringify(style))
          JS
          node gen-style.mjs

      - name: Fetch Protomaps glyphs + sprites
        run: git clone --depth 1 https://github.com/protomaps/basemaps-assets.git

      - name: Upload style, glyphs and sprites to R2
        run: |
          rclone copyto style.json "r2:bikeindex-maps/basemap/style.json" \
            --s3-no-check-bucket --header-upload "Cache-Control: public, max-age=86400"
          rclone copy basemaps-assets/fonts "r2:bikeindex-maps/basemap/fonts" \
            --s3-no-check-bucket --header-upload "Cache-Control: public, max-age=86400"
          rclone copy basemaps-assets/sprites "r2:bikeindex-maps/basemap/sprites" \
            --s3-no-check-bucket --header-upload "Cache-Control: public, max-age=86400"

      - name: Done
        run: echo "Uploaded style.json, fonts and sprites. Purge the Cloudflare cache for https://maps.bikeindex.org."
