name: iOS E2E CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]

jobs:
  test-suite:
    name: "${{ matrix.device }} ${{ matrix.only-testing }}"
    runs-on: macos-26
    strategy:
      matrix:
        device: ["iPhone 17"] # "iPhone 17 Pro", "iPad (A16)"
        only-testing: ["UITests"]
    env:
      DEV_PORT: 3042

    steps:
      - name: Checkout bike_index
        uses: actions/checkout@v6

      - name: Install rails dependencies
        run: |
          brew install plistbuddy

      - name: Start Rails dev server
        env:
          RAILS_ENV: development
        run: |
          bin/setup --skip-server || true
          bin/rails db:create db:schema:load:primary db:schema:load:analytics db:migrate 2>/dev/null || \
            bin/rails db:create db:migrate

          redis-server --daemonize yes --port 6379 &
          RAILS_MAX_THREADS=1 bin/dev > /tmp/rails_dev.log 2>&1 &
          DEV_PID=$!

          for i in $(seq 1 120); do
            if curl -fs http://localhost:${DEV_PORT} >/dev/null 2>&1; then
              echo "Rails dev server ready on port ${DEV_PORT}"
              break
            fi
            sleep 1
          done

      - name: Checkout bike_index_ios
        uses: actions/checkout@v6
        with:
          repository: bikeindex/bike_index_ios
          path: .
          ref: ${{ github.ref }}

      - name: Set Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Install tools
        run: brew bundle install

      - name: Set up xcconfig (see README.md#quick-start)
        env:
          API_SECRET: ${{ secrets.DEVELOPMENT__API_SECRET }}
          API_CLIENT_ID: ${{ secrets.DEVELOPMENT__API_CLIENT_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          HONEYBADGER_API_KEY: ${{ secrets.HONEYBADGER_API_KEY }}
        run: |
          echo '#include "Default"' >> BikeIndex-development.xcconfig
          echo "API_SECRET = $API_SECRET" >> BikeIndex-development.xcconfig
          echo "API_CLIENT_ID = $API_CLIENT_ID" >> BikeIndex-development.xcconfig
          echo "DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM" >> BikeIndex-development.xcconfig
          echo "HONEYBADGER_API_KEY = $HONEYBADGER_API_KEY" >> BikeIndex-development.xcconfig

      - name: Set up xcconfig UI test credentials (see README.md#UI-Test-configuration)
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          echo "TEST_USERNAME = $TEST_USERNAME" >> Test-credentials.xcconfig
          echo "TEST_PASSWORD = $TEST_PASSWORD" >> Test-credentials.xcconfig

      - name: Validate xcconfigs
        run: ./scripts/validate-xcconfig.sh development && ./scripts/validate-xcconfig.sh test

      - name: List available simulators
        run: xcodebuild -scheme BikeIndex -project BikeIndex.xcodeproj -showdestinations

      - name: Build
        run: fastlane scan --build_for_testing=true

      - name: "${{ matrix.only-testing }}" on "${{ matrix.device }}"
        run: fastlane scan --only-testing="${{ matrix.only-testing }}" --device="${{ matrix.device }}" \
          --test_without_building=true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: "test_output_${{ matrix.device }}_${{ matrix.only-testing }}"
          path: "fastlane/test_output/*"
          compression-level: 9 # maximum compression

      - name: Wait for rails dev server to complete
        if: always()
        run: wait $DEV_PID 2>/dev/null || true

      - name: Collect rails logs from this job
        if: always()
        run: cp log/development.log /tmp/rails_dev.log

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: "rails-dev-log-${{ matrix.device }}_${{ matrix.only-testing }}"
          path: /tmp/rails_dev.log
